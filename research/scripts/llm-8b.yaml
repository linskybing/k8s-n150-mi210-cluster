# Llama-3.1-8B-Instruct on n150 (EXP-06): the image Tenstorrent pairs with this model for N150 (tt-inference-server v0.11.1
# release_model_spec.json), spec llama-3.1-8b-n150.json via configmap llm-spec-8b (lc.sh vllm-8b).
# The 0.9.0 image differs from 0.11.1: no weight download, spec via TT_MODEL_SPEC_JSON_PATH, no CLI args (no_auth is in the
# spec's cli_args); env values as in its workflows/run_docker_server.py. Ready = /tmp/ready, written after trace capture.
apiVersion: batch/v1
kind: Job
metadata:
  name: n150-llm
spec:
  template:
    spec:
      restartPolicy: Never
      resourceClaims:
        - {name: n150, resourceClaimTemplateName: n150}
      initContainers:
        - name: weights            # resumes / skips files already in the host cache
          image: ghcr.io/tenstorrent/tt-inference-server/vllm-tt-metal-src-release-ubuntu-22.04-amd64:0.9.0-25305db-6e67d2d
          securityContext: {runAsUser: 0}
          command: [bash, -c, 'source $PYTHON_ENV_DIR/bin/activate && python -c "import os; from huggingface_hub import snapshot_download as d; d(\"meta-llama/Llama-3.1-8B-Instruct\", local_dir=os.environ[\"MODEL_WEIGHTS_PATH\"], ignore_patterns=[\"original/*\"])"']
          env:
            - {name: MODEL_WEIGHTS_PATH, value: /home/container_app_user/cache_root/weights/Llama-3.1-8B-Instruct}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: {name: hf-token, key: token}
          volumeMounts:
            - {name: cache, mountPath: /home/container_app_user/cache_root}
      containers:
        - name: vllm
          image: ghcr.io/tenstorrent/tt-inference-server/vllm-tt-metal-src-release-ubuntu-22.04-amd64:0.9.0-25305db-6e67d2d
          securityContext: {runAsUser: 0}
          # the image's Cmd without its gosu entrypoint (gosu drops the supplementalGroups the n150 needs)
          command: [bash, -c, 'source $PYTHON_ENV_DIR/bin/activate && python run_vllm_api_server.py']
          env:
            - {name: CACHE_ROOT, value: /home/container_app_user/cache_root}
            - {name: MODEL_WEIGHTS_PATH, value: /home/container_app_user/cache_root/weights/Llama-3.1-8B-Instruct}
            - {name: TT_CACHE_PATH, value: /home/container_app_user/cache_root/tt_metal_cache/cache_Llama-3.1-8B-Instruct/N150}
            - {name: TT_MODEL_SPEC_JSON_PATH, value: /spec/spec.json}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: {name: hf-token, key: token}
          readinessProbe:
            exec: {command: [test, -f, /tmp/ready]}
          volumeMounts:
            - {name: spec, mountPath: /spec}
            - {name: cache, mountPath: /home/container_app_user/cache_root}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: spec
          configMap: {name: llm-spec}
        - name: cache
          hostPath: {path: /home/testuser/.cache/tt-vllm-8b, type: DirectoryOrCreate}
        - name: shm                # TT runs this image with --shm-size 32G
          emptyDir: {medium: Memory, sizeLimit: 32Gi}
