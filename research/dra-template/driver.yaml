# Cluster side of the chip.example.com DRA driver (report v4, Sec. 5.3): RBAC, the kubelet plugin DaemonSet, the DeviceClass.
apiVersion: v1
kind: Namespace
metadata:
  name: chip-dra
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chip-dra-kubeletplugin
  namespace: chip-dra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chip-dra-kubeletplugin
rules:
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims]
    verbs: [get, list, watch]
  - apiGroups: [resource.k8s.io]
    resources: [resourceslices]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chip-dra-kubeletplugin
subjects:
  - {kind: ServiceAccount, name: chip-dra-kubeletplugin, namespace: chip-dra}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: chip-dra-kubeletplugin}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: chip-dra-kubeletplugin
  namespace: chip-dra
spec:
  selector:
    matchLabels: {app: chip-dra-kubeletplugin}
  template:
    metadata:
      labels: {app: chip-dra-kubeletplugin}
    spec:
      serviceAccountName: chip-dra-kubeletplugin
      nodeSelector: {feature.node.kubernetes.io/pci-1234.present: "true"}   # nodes with the card (node-feature-discovery label)
      containers:
        - name: plugin
          image: registry.example.com/chip-dra-driver:0.1.0
          securityContext: {privileged: true}
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          volumeMounts:
            - {name: plugins-registry, mountPath: /var/lib/kubelet/plugins_registry}
            - {name: plugins, mountPath: /var/lib/kubelet/plugins, mountPropagation: Bidirectional}
            - {name: cdi, mountPath: /var/run/cdi}
            - {name: dev, mountPath: /dev}
      volumes:
        - {name: plugins-registry, hostPath: {path: /var/lib/kubelet/plugins_registry}}
        - {name: plugins, hostPath: {path: /var/lib/kubelet/plugins}}
        - {name: cdi, hostPath: {path: /var/run/cdi, type: DirectoryOrCreate}}
        - {name: dev, hostPath: {path: /dev}}
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: chip.example.com
spec:
  selectors:
    - cel:
        expression: device.driver == 'chip.example.com'
  extendedResourceName: chip.example.com/chip   # optional: also requestable as an extended resource (as tenstorrent.com/chip)
