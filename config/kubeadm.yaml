# kubeadm init --config config/kubeadm.yaml (scripts/node.sh). Single node; metrics endpoints open for Prometheus.
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
nodeRegistration:
  ignorePreflightErrors: [Swap]
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: v1.36.5
networking:
  podSubnet: 10.42.0.0/16
apiServer:
  certSANs: [127.0.0.1, <node-ip>] # user kubeconfigs use 127.0.0.1
etcd:
  local:
    extraArgs:
      - {name: listen-metrics-urls, value: "http://0.0.0.0:2381"}
controllerManager:
  extraArgs:
    - {name: bind-address, value: 0.0.0.0}
scheduler:
  extraArgs:
    - {name: bind-address, value: 0.0.0.0}
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: systemd
failSwapOn: false
memorySwap:
  swapBehavior: NoSwap
---
apiVersion: kubeproxy.config.k8s.io/v1alpha1
kind: KubeProxyConfiguration
metricsBindAddress: 0.0.0.0:10249
