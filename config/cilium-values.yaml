# kube-proxy stays (kubeadm default); Cilium for CNI + NetworkPolicy + Hubble flow metrics, all scraped by Prometheus
ipam:
  operator:
    clusterPoolIPv4PodCIDRList: [10.42.0.0/16] # = podSubnet in kubeadm.yaml
operator:
  replicas: 1
  prometheus:
    enabled: true
    serviceMonitor: {enabled: true}
prometheus:
  enabled: true
  serviceMonitor: {enabled: true}
hubble:
  relay:
    enabled: true
  metrics:
    enabled: [dns, drop, tcp, flow, port-distribution, icmp, httpV2]
    serviceMonitor: {enabled: true}
